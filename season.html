<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シーズン総括 - カープトーク</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--surface:#111318;--surface2:#181c23;--surface3:#1e2330;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#eef0f4;--muted:#7a8090;--faint:#2e3340;--accent:#f0c040;--blue:#4a9eff;--green:#3ecf8e;--red:#f46060;--orange:#f07840;--carp:#c8102e;--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
header{border-bottom:1px solid var(--border);padding:0 1.25rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(10,12,15,0.96);backdrop-filter:blur(14px);z-index:100}
.site-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.1em;color:var(--carp);line-height:1}
.site-sub{font-size:10px;color:var(--muted)}
.wrap{max-width:680px;margin:0 auto;padding:0 1rem 5rem}
a{color:inherit;text-decoration:none}
.bc{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--blue);margin:1rem 0 .25rem}
.bc:hover{text-decoration:underline}
/* Hero */
.hero{background:radial-gradient(ellipse at top,rgba(200,16,46,.14),transparent 60%),linear-gradient(180deg,var(--surface),#0c0d12);border:1px solid rgba(200,16,46,.3);border-radius:var(--r);padding:1.5rem 1.25rem;margin:1rem 0;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--carp),#ff4060,var(--accent))}
.hero-yr{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.2em;color:var(--accent)}
.hero-title{font-size:21px;font-weight:700;margin:.3rem 0 .6rem;line-height:1.4}
.hero-rec{display:flex;align-items:baseline;gap:12px;margin:.5rem 0}
.hero-rec .big{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--text);line-height:1}
.hero-rec .pct{font-size:15px;color:var(--muted)}
.hero-ov{font-size:13.5px;line-height:1.75;color:#d5d8de;margin-top:.6rem}
.hero-period{font-size:11px;color:var(--muted);margin-top:.5rem}
/* section */
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.1rem;margin-bottom:1rem}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--carp);text-transform:uppercase;margin-bottom:.9rem;display:flex;align-items:center;gap:6px}
/* monthly bars */
.mon-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--rs);cursor:pointer;transition:background .15s}
.mon-row:hover{background:var(--surface2)}
.mon-lbl{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--text);width:40px;flex-shrink:0;white-space:nowrap}
.mon-bar{flex:1;height:18px;background:var(--faint);border-radius:4px;overflow:hidden;display:flex}
.mon-bar .wseg{background:var(--carp)}
.mon-bar .lseg{background:var(--surface3)}
.mon-rec{font-size:12px;color:var(--muted);width:72px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.mon-arrow{color:var(--faint);font-size:12px}
/* themes */
.theme{border-left:3px solid var(--accent);background:rgba(240,192,64,.05);border-radius:0 var(--rs) var(--rs) 0;padding:.6rem .8rem;margin-bottom:.6rem}
.theme-t{font-size:13.5px;font-weight:700;color:var(--accent);margin-bottom:.2rem}
.theme-d{font-size:12.5px;line-height:1.6;color:#c5c8ce}
/* leaders */
.ldr-grp{margin-bottom:.9rem}
.ldr-h{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:.4rem}
.ldr-row{display:flex;align-items:baseline;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--border)}
.ldr-row:last-child{border-bottom:none}
.ldr-rank{color:var(--faint);font-family:'Bebas Neue',sans-serif;width:16px}
.ldr-name{flex:1;font-weight:500}
.ldr-val{font-variant-numeric:tabular-nums;color:var(--text)}
.ldr-sub{font-size:11px;color:var(--muted)}
.qmark{font-size:9px;color:var(--green);border:1px solid rgba(62,207,142,.4);border-radius:3px;padding:0 3px;margin-left:4px}
.ldr-tabs{display:flex;gap:6px;margin-bottom:.8rem}
.ldr-tab{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:5px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit}
.ldr-tab.active{background:rgba(200,16,46,.15);border-color:rgba(200,16,46,.4);color:#ff7090}
/* highlights */
.hl{display:flex;gap:10px;align-items:center;padding:.5rem .3rem;border-bottom:1px solid var(--border)}
.hl:last-child{border-bottom:none}
.hl-ico{font-size:18px}
.hl-body{flex:1}
.hl-t{font-size:12px;color:var(--muted)}
.hl-d{font-size:13.5px;font-weight:500}
.hl a{color:var(--blue)}
/* next question */
.nextq{background:rgba(74,158,255,.06);border-left:3px solid var(--blue);border-radius:0 var(--rs) var(--rs) 0;padding:.8rem 1rem;margin-bottom:1rem}
.nextq-l{font-size:10.5px;color:var(--blue);letter-spacing:.05em;margin-bottom:.3rem}
.nextq-t{font-size:14px;line-height:1.6}
/* daily list (Lv2) */
.day-row{display:flex;align-items:center;gap:10px;padding:.7rem .6rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.day-row:hover{background:var(--surface2)}
.day-date{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--muted);width:42px;flex-shrink:0}
.day-res{font-weight:700;width:20px;text-align:center;flex-shrink:0}
.day-res.W{color:var(--carp)}.day-res.L{color:var(--muted)}.day-res.D{color:var(--accent)}
.day-score{font-variant-numeric:tabular-nums;font-size:13px;width:58px;flex-shrink:0}
.day-body{flex:1;min-width:0}
.day-opp{font-size:12px;color:var(--muted)}
.day-title{font-size:12.5px;color:#d5d8de;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-arrow{color:var(--faint);font-size:12px}
.month-nav{display:flex;gap:6px;flex-wrap:wrap;margin:.5rem 0 1rem}
.month-chip{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;padding:4px 11px;font-size:13px;color:var(--muted);cursor:pointer;font-family:'Bebas Neue',sans-serif;letter-spacing:.05em}
.month-chip.active{background:rgba(200,16,46,.15);border-color:rgba(200,16,46,.4);color:#ff7090}
/* league metrics */
.hero-standing{display:inline-flex;align-items:center;gap:6px;background:rgba(240,192,64,.1);border:1px solid rgba(240,192,64,.3);color:var(--accent);border-radius:6px;padding:2px 10px;font-size:12.5px;font-weight:700;margin-top:.2rem}
.mgrp-h{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:.9rem 0 .45rem}
.mgrp-h:first-of-type{margin-top:0}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(max-width:420px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mcard{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:.55rem .6rem;position:relative}
.mcard-l{font-size:10.5px;color:var(--muted)}
.mcard-v{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1.1;letter-spacing:.02em}
.mcard-r{position:absolute;top:.5rem;right:.5rem;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px}
.r1{background:rgba(62,207,142,.15);color:var(--green)}.r2,.r3{background:rgba(74,158,255,.12);color:var(--blue)}
.r4{background:var(--faint);color:var(--muted)}.r5,.r6{background:rgba(244,96,96,.12);color:var(--red)}
.mdots{display:flex;gap:3px;margin-top:4px}
.mdots i{flex:1;height:3px;border-radius:2px;background:var(--faint)}
.mdots i.on{background:var(--carp)}
.mcard-b{font-size:9.5px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.std-t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.std-t td,.std-t th{padding:5px 4px;border-bottom:1px solid var(--border);text-align:right}
.std-t th{font-size:10.5px;color:var(--muted);font-weight:500}
.std-t td:nth-child(2),.std-t th:nth-child(2){text-align:left}
.std-t tr.me td{color:#ff7090;font-weight:700}
.vs-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:.7rem}
.vs-chip{font-size:11.5px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 8px;color:var(--muted)}
.vs-chip b{color:var(--text);font-weight:500}
/* players */
.pl{border:1px solid var(--border);border-radius:var(--rs);margin-bottom:6px;background:var(--surface2);overflow:hidden}
.pl-h{display:flex;align-items:center;gap:8px;padding:.6rem .7rem;cursor:pointer}
.pl-name{font-weight:700;font-size:14px;white-space:nowrap}
.pl-tag{font-size:11px;color:var(--accent);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-stat{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pl-arrow{color:var(--faint);font-size:11px;transition:transform .2s}
.pl.open .pl-arrow{transform:rotate(90deg)}
.pl-b{display:none;padding:0 .8rem .8rem;border-top:1px solid var(--border)}
.pl.open .pl-b{display:block}
.pl-line{font-size:11.5px;color:var(--muted);margin:.6rem 0 .4rem;line-height:1.6;font-variant-numeric:tabular-nums}
.pl-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.4rem}
.pl-badge{font-size:10.5px;background:rgba(240,192,64,.1);color:var(--accent);border-radius:4px;padding:1px 6px}
.pl-rev{font-size:13px;line-height:1.75;color:#d5d8de}
.pl-next{font-size:12px;color:var(--blue);margin-top:.5rem;line-height:1.6}
.spark{display:flex;align-items:flex-end;gap:4px;margin:.5rem 0 .6rem}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.spark b{font-weight:400;font-size:9px;color:var(--muted);margin-bottom:2px;font-variant-numeric:tabular-nums}
.spark span{display:block;width:100%;background:var(--carp);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.spark em{font-style:normal;font-size:9px;color:var(--muted);margin-top:2px}
.spark-l{font-size:9.5px;color:var(--faint)}
.tps-h{font-size:11px;font-weight:700;color:var(--carp);letter-spacing:.05em;margin:.8rem 0 .4rem}
.tpi{display:block;border-left:3px solid var(--orange);background:rgba(240,120,64,.05);border-radius:0 6px 6px 0;padding:.5rem .65rem;margin-bottom:6px;text-decoration:none;color:inherit;transition:background .15s}
.tpi.strong{border-left-color:var(--carp);background:rgba(200,16,46,.06)}
.tpi:hover{background:rgba(255,255,255,.04)}
.tpi-top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:2px;font-variant-numeric:tabular-nums}
.tpi-res{font-weight:700;font-size:10.5px;border-radius:3px;padding:0 5px}
.tpi-res.W{background:rgba(200,16,46,.18);color:#ff7090}.tpi-res.L{background:var(--faint);color:var(--muted)}.tpi-res.D{background:rgba(240,192,64,.12);color:var(--accent)}
.tpi-d{font-size:12.5px;line-height:1.55;color:#e2e4e8}
.tpi-w{font-size:11.5px;color:var(--accent);margin-top:3px;line-height:1.5}
.tpi-go{margin-left:auto;color:var(--blue);font-size:11px;white-space:nowrap}
.pl-sc{font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pl-sc .p{color:var(--green)}.pl-sc .m{color:var(--red)}
.scb{margin:.8rem 0 .3rem}
.scb-nums{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.scb-nums .p{color:var(--green);font-weight:700}.scb-nums .m{color:var(--red);font-weight:700}
.scb-nums small{font-weight:400;color:var(--muted);font-size:10.5px}
.scb-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--faint)}
.scb-bar .p{background:var(--green)}.scb-bar .m{background:var(--red)}
.scl-h{font-size:11px;font-weight:700;margin:.7rem 0 .3rem}
.scl-h.p{color:var(--green)}.scl-h.m{color:var(--red)}
.sci{display:flex;gap:6px;align-items:baseline;font-size:12px;padding:4px 2px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.sci:hover{background:rgba(255,255,255,.03)}
.sci-d{color:var(--muted);font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:74px}
.sci-t{flex:1;color:#dfe1e5}
.sci-big{font-size:9.5px;border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap}
.sci-big.p{background:rgba(62,207,142,.15);color:var(--green)}.sci-big.m{background:rgba(244,96,96,.15);color:var(--red)}
.sci-go{color:var(--blue);font-size:10.5px}
.sc-more{background:none;border:none;color:var(--blue);font-size:11px;cursor:pointer;padding:4px 0;font-family:inherit}
.hero-rank{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:.6rem .7rem;margin-bottom:.8rem}
.hero-rank-h{font-size:11px;font-weight:700;color:var(--green);margin-bottom:.35rem}
.hr-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.hr-row .n{flex:1}.hr-row .v{color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.hr-row .s{font-size:10.5px;color:var(--muted)}
.src{font-size:10px;color:var(--faint);margin-top:.6rem}
.loading{text-align:center;padding:4rem 0;color:var(--muted)}
.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--faint);border-top-color:var(--carp);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div><div class="site-title">本日のカープトーク</div><div class="site-sub">2026シーズン総括</div></div>
  <a class="bc" href="/season.html" style="margin:0">⚾ 総括トップ</a>
</header>
<div class="wrap" id="main"><div class="loading"><span class="spin"></span></div></div>

<script>
var DATA=null;
var MONTH_NAMES={'03':'3月','04':'4月','05':'5月','06':'6月','07':'7月','08':'8月','09':'9月','10':'10月'};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qs(k){return new URLSearchParams(location.search).get(k);}

async function init(){
  try{
    var r=await fetch('/games/season_summary_2026.json?t='+Date.now());
    DATA=await r.json();
  }catch(e){
    document.getElementById('main').innerHTML='<div class="loading">総括データを読み込めませんでした</div>';
    return;
  }
  var month=qs('month');
  if(month) renderMonth(month);
  else renderSeason();
}

function renderSeason(){
  var d=DATA, rec=d.record, n=d.narrative||{}, L=d.leaders||{};
  var h='';
  // Hero
  h+='<div class="hero">';
  h+='<div class="hero-yr">CARP '+d.year+' SEASON</div>';
  h+='<div class="hero-title">'+esc(n.title||'シーズン総括')+'</div>';
  h+='<div class="hero-rec"><span class="big">'+rec.w+'<span style="font-size:22px;color:var(--muted)">勝</span> '+rec.l+'<span style="font-size:22px;color:var(--muted)">敗</span> '+rec.d+'<span style="font-size:22px;color:var(--muted)">分</span></span><span class="pct">勝率 '+rec.pct.toFixed(3).replace(/^0/,'')+'</span></div>';
  if(d.league)h+='<div class="hero-standing">セ・リーグ '+d.league.standing+'位 <span style="font-weight:400;opacity:.8">首位と'+esc(d.league.gb)+'差</span></div>';
  if(n.overview)h+='<div class="hero-ov">'+esc(n.overview)+'</div>';
  h+='<div class="hero-period">'+d.period.first+' 〜 '+d.period.last+' ／ 得失点差 '+(d.runs.diff>0?'+':'')+d.runs.diff+'（'+d.runs.scored+'得点 '+d.runs.allowed+'失点）</div>';
  h+='</div>';

  // 月別成績
  h+='<div class="sec"><div class="sec-t">📅 月別成績（タップで日別へ）</div>';
  d.monthly.forEach(function(m){
    var tot=m.w+m.l+m.d||1;
    var wp=Math.round(m.w/tot*100), lp=Math.round(m.l/tot*100);
    h+='<div class="mon-row" onclick="location.href=\'?month='+d.year+'-'+m.month+'\'">';
    h+='<span class="mon-lbl">'+parseInt(m.month)+'月</span>';
    h+='<div class="mon-bar"><div class="wseg" style="width:'+wp+'%"></div><div class="lseg" style="width:'+lp+'%"></div></div>';
    h+='<span class="mon-rec">'+m.w+'-'+m.l+(m.d?'-'+m.d:'')+'</span><span class="mon-arrow">›</span></div>';
  });
  h+='</div>';

  // チーム主要指標（セ・リーグ内順位）
  if(d.league)h+=renderLeague(d.league);

  // 今季のテーマ
  if(n.themes&&n.themes.length){
    h+='<div class="sec"><div class="sec-t">🎯 今季のテーマ</div>';
    n.themes.forEach(function(t){
      h+='<div class="theme"><div class="theme-t">'+esc(t.theme)+'</div><div class="theme-d">'+esc(t.detail)+'</div></div>';
    });
    h+='</div>';
  }

  // シーズンの分岐点
  if(n.turning_point){
    h+='<div class="sec"><div class="sec-t">🔀 シーズンの分岐点</div><div style="font-size:13.5px;line-height:1.75;color:#d5d8de">'+esc(n.turning_point)+'</div></div>';
  }

  // 成績リーダー
  if(L.batting||L.pitching){
    h+='<div class="sec"><div class="sec-t">🏆 今季の成績</div>';
    h+='<div class="ldr-tabs"><button class="ldr-tab active" id="lt-bat" onclick="swLdr(\'bat\')">打撃</button><button class="ldr-tab" id="lt-pit" onclick="swLdr(\'pit\')">投手</button></div>';
    h+='<div id="ldr-bat">'+renderBatLeaders(L.batting||{})+'</div>';
    h+='<div id="ldr-pit" style="display:none">'+renderPitLeaders(L.pitching||{})+'</div>';
    if(L.kiteiPA)h+='<div style="font-size:10px;color:var(--faint);margin-top:.6rem">※ 打率は規定打席（'+L.kiteiPA+'）到達者のみ。<span class="qmark">規</span>＝規定到達</div>';
    h+='</div>';
  }

  // 選手個人の振り返り
  if(d.players&&d.players.length)h+=renderPlayers(d.players);

  // ハイライト
  if(d.highlights){
    var hl=d.highlights;
    h+='<div class="sec"><div class="sec-t">✨ 今季のハイライト</div>';
    if(hl.biggestWin)h+=hlRow('🔥','最大差の勝利',hl.biggestWin.date,'vs'+hl.biggestWin.opp+' '+hl.biggestWin.cs+'-'+hl.biggestWin.os);
    if(hl.highestScoring&&hl.highestScoring.date!==(hl.biggestWin||{}).date)h+=hlRow('💥','最多得点',hl.highestScoring.date,'vs'+hl.highestScoring.opp+' '+hl.highestScoring.cs+'得点');
    h+=hlRow('📈','最長連勝','', d.streaks.longestWin+'連勝');
    h+=hlRow('📉','最長連敗','', d.streaks.longestLose+'連敗');
    if(hl.worstLoss)h+=hlRow('🧊','最大差の敗戦',hl.worstLoss.date,'vs'+hl.worstLoss.opp+' '+hl.worstLoss.cs+'-'+hl.worstLoss.os);
    h+='</div>';
  }

  // 来季への問い
  if(n.next_season){
    h+='<div class="nextq"><div class="nextq-l">↪ 来季への問い</div><div class="nextq-t">'+esc(n.next_season)+'</div></div>';
  }

  document.getElementById('main').innerHTML=h;
}

function hlRow(ico,t,date,desc){
  var link=date?('<a href="/?date='+date+'">'+desc+' ›</a>'):desc;
  return '<div class="hl"><span class="hl-ico">'+ico+'</span><div class="hl-body"><div class="hl-t">'+t+(date?' ('+date.slice(5)+')':'')+'</div><div class="hl-d">'+link+'</div></div></div>';
}

function renderBatLeaders(b){
  var h='';
  h+='<div class="ldr-grp"><div class="ldr-h">打率（規定到達）</div>';
  (b.avg||[]).forEach(function(x,i){h+='<div class="ldr-row"><span class="ldr-rank">'+(i+1)+'</span><span class="ldr-name">'+esc(x.name)+'</span><span class="ldr-val">'+esc(x.avg)+'</span><span class="ldr-sub">'+x.hr+'本 '+x.rbi+'点</span></div>';});
  if(!(b.avg||[]).length)h+='<div class="ldr-sub" style="padding:4px 0">規定到達者なし</div>';
  h+='</div>';
  h+='<div class="ldr-grp"><div class="ldr-h">本塁打</div>';
  (b.hr||[]).forEach(function(x,i){h+='<div class="ldr-row"><span class="ldr-rank">'+(i+1)+'</span><span class="ldr-name">'+esc(x.name)+'</span><span class="ldr-val">'+x.hr+'本</span></div>';});
  h+='</div>';
  h+='<div class="ldr-grp"><div class="ldr-h">打点</div>';
  (b.rbi||[]).forEach(function(x,i){h+='<div class="ldr-row"><span class="ldr-rank">'+(i+1)+'</span><span class="ldr-name">'+esc(x.name)+'</span><span class="ldr-val">'+x.rbi+'点</span></div>';});
  h+='</div>';
  return h;
}

function renderPitLeaders(p){
  var h='';
  h+='<div class="ldr-grp"><div class="ldr-h">先発（防御率順）</div>';
  (p.starters||[]).forEach(function(x,i){h+='<div class="ldr-row"><span class="ldr-rank">'+(i+1)+'</span><span class="ldr-name">'+esc(x.name)+(x.qualified?'<span class="qmark">規</span>':'')+'</span><span class="ldr-val">'+esc(x.era)+'</span><span class="ldr-sub">'+esc(x.ip)+'回 '+x.wins+'勝'+x.losses+'敗</span></div>';});
  h+='</div>';
  h+='<div class="ldr-grp"><div class="ldr-h">救援</div>';
  (p.relievers||[]).forEach(function(x,i){h+='<div class="ldr-row"><span class="ldr-rank">'+(i+1)+'</span><span class="ldr-name">'+esc(x.name)+'</span><span class="ldr-val">'+esc(x.era)+'</span><span class="ldr-sub">'+x.games+'登板 '+(x.saves||0)+'S '+(x.hp!=null?x.hp+'HP':(x.holds||0)+'H')+'</span></div>';});
  h+='</div>';
  return h;
}

var CAT_LABEL={batting:'打撃',pitching:'投手',fielding:'守備'};
function renderLeague(L){
  var h='<div class="sec"><div class="sec-t">📊 チーム主要指標（セ・リーグ6球団中の順位）</div>';
  ['batting','pitching','fielding'].forEach(function(cat){
    var ms=L.metrics.filter(function(m){return m.cat===cat;});
    if(!ms.length)return;
    h+='<div class="mgrp-h">'+CAT_LABEL[cat]+'</div><div class="mgrid">';
    ms.forEach(function(m){
      var dots='';for(var i=6;i>=1;i--)dots+='<i class="'+(i>=m.rank?'on':'')+'"></i>';
      var best=m.rank===1?'リーグ1位':('1位 '+esc(m.best.team)+' '+esc(m.best.value));
      h+='<div class="mcard"><div class="mcard-l">'+esc(m.label)+(m.higherIsBetter?'':'<span style="font-size:9px;opacity:.7">（少ない順）</span>')+'</div><div class="mcard-v">'+esc(m.value)+'</div>'
        +'<span class="mcard-r r'+m.rank+'">'+m.rank+'位</span><div class="mdots">'+dots+'</div><div class="mcard-b">'+best+'</div></div>';
    });
    h+='</div>';
  });
  // 順位表
  h+='<div class="mgrp-h">順位表</div><table class="std-t"><tr><th></th><th>チーム</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th><th>差</th></tr>';
  L.standings.forEach(function(t){
    h+='<tr class="'+(t.team==='広島'?'me':'')+'"><td>'+t.standing+'</td><td>'+esc(t.team)+'</td><td>'+t.w+'</td><td>'+t.l+'</td><td>'+t.d+'</td><td>'+esc(t.pct)+'</td><td>'+esc(t.gb)+'</td></tr>';
  });
  h+='</table>';
  if(L.vs){
    h+='<div class="vs-row">';
    Object.keys(L.vs).forEach(function(k){
      var p=String(L.vs[k]).split('-');
      h+='<span class="vs-chip">'+(/ホーム|ロード|交流戦/.test(k)?'':'対')+esc(k)+' <b>'+p[0]+'勝'+p[1]+'敗'+(p[2]&&p[2]!=='0'?p[2]+'分':'')+'</b></span>';
    });
    h+='</div>';
  }
  h+='<div class="src">出典：'+esc(L.source||'NPB公式')+'（全日程終了後の確定値）</div></div>';
  return h;
}

function plStatShort(p){
  var s=p.stat;
  if(p.type==='batter')return s.avg+' '+s.hr+'本 '+s.rbi+'点';
  if((s.starts||0)>=7)return s.w+'勝'+s.l+'敗 防'+s.era;
  return s.g+'登板 防'+s.era+(s.sv?' '+s.sv+'S':'')+(s.hp?' '+s.hp+'HP':'');
}
function plStatLine(p){
  var s=p.stat;
  if(p.type==='batter')return s.bats+'打｜'+s.g+'試合 '+s.pa+'打席 打率'+s.avg+' '+s.hr+'本塁打 '+s.rbi+'打点 '+s.sb+'盗塁<br>出塁率'+s.obp+' 長打率'+s.slg+' OPS'+s.ops+' 四球'+s.bb+' 三振'+s.so;
  var role=(s.starts||0)>=7?('先発'+s.starts+(s.relief?'・救援'+s.relief:'')):('救援'+(s.relief||s.g));
  return s.throws+'投・'+role+'｜'+s.g+'登板 '+s.w+'勝'+s.l+'敗'+s.sv+'S'+s.hld+'H 防御率'+s.era+'<br>'+s.ip+'回 奪三振'+s.so+' 与四球'+s.bb+' 被本塁打'+s.hr+' WHIP'+s.whip;
}
function plSpark(p){
  var m=p.monthly||[];if(m.length<2)return '';
  var isB=p.type==='batter';
  var vals=m.map(function(x){return isB?parseFloat(x.avg)||0:(x.era==='-'?0:parseFloat(x.era));});
  var max=Math.max.apply(null,vals)||1, min=Math.min.apply(null,vals);
  var h='<div class="spark-l">月別'+(isB?'打率':'防御率（低いほど良い）')+'・試合データ集計（参考）</div><div class="spark">';
  m.forEach(function(x,i){
    var px=max===min?20:Math.round(8+(vals[i]-min)/(max-min)*30);
    var lab=isB?x.avg:x.era;
    h+='<div title="'+parseInt(x.month)+'月 '+(isB?x.avg+'（'+x.ab+'打数）':x.era+'（'+x.g+'登板 '+x.ip+'回）')+'"><b>'+esc(lab)+'</b><span style="height:'+px+'px'+(isB?'':';background:var(--blue)')+'"></span><em>'+parseInt(x.month)+'月</em></div>';
  });
  return h+'</div>';
}
function sceneItem(x){
  var inn=parseInt(x.inning,10)||'';
  var rl=x.result==='W'?'○':x.result==='L'?'●':'△';
  return '<a class="sci" href="/?date='+x.date+(inn?'&tp='+inn:'')+'"><span class="sci-d">'+x.date.slice(5).replace('-','/')+' '+rl+esc(x.score)+'</span>'
    +'<span class="sci-t">'+(x.inning?'<span style="color:var(--muted)">'+esc(x.inning)+'</span> ':'')+esc(x.summary)+(x.impact==='big'?'<span class="sci-big '+(x.sign==='+'?'p':'m')+'">勝敗直結</span>':'')+'</span><span class="sci-go">›</span></a>';
}
function plScenes(p,id){
  var sc=p.scenes;if(!sc||(!sc.saved&&!sc.hurt))return '';
  var tot=sc.saved+sc.hurt||1;
  var h='<div class="scb"><div class="scb-nums"><span class="p">チームを救った場面 '+sc.saved+' <small>（勝敗直結 '+sc.bigSaved+'）</small></span><span class="m"><small>（勝敗直結 '+sc.bigHurt+'）</small> 痛かった場面 '+sc.hurt+'</span></div>'
    +'<div class="scb-bar"><div class="p" style="width:'+(sc.saved/tot*100)+'%"></div><div class="m" style="width:'+(sc.hurt/tot*100)+'%"></div></div></div>';
  ['+','-'].forEach(function(sg){
    var list=(sc.list||[]).filter(function(x){return x.sign===sg;});
    if(!list.length)return;
    var cls=sg==='+'?'p':'m';
    h+='<div class="scl-h '+cls+'">'+(sg==='+'?'🦸 救ったシーン':'💧 痛かったシーン')+'</div>';
    list.slice(0,3).forEach(function(x){h+=sceneItem(x);});
    if(list.length>3){
      h+='<div id="scm-'+id+cls+'" style="display:none">';list.slice(3).forEach(function(x){h+=sceneItem(x);});h+='</div>';
      h+='<button class="sc-more" onclick="var e=document.getElementById(\'scm-'+id+cls+'\');var o=e.style.display===\'none\';e.style.display=o?\'block\':\'none\';this.textContent=o?\'閉じる\':\'すべて見る（'+list.length+'件）\'">すべて見る（'+list.length+'件）</button>';
    }
  });
  return h;
}
function heroRanking(P){
  var r=P.filter(function(p){return p.scenes&&p.scenes.saved;}).sort(function(a,b){return b.scenes.saved-a.scenes.saved||b.scenes.bigSaved-a.scenes.bigSaved;}).slice(0,5);
  if(!r.length)return '';
  var h='<div class="hero-rank"><div class="hero-rank-h">🦸 チームを救った場面が多かった選手</div>';
  r.forEach(function(p,i){h+='<div class="hr-row"><span class="ldr-rank">'+(i+1)+'</span><span class="n">'+esc(p.name)+'</span><span class="s">勝敗直結 '+p.scenes.bigSaved+'</span><span class="v">'+p.scenes.saved+'</span></div>';});
  return h+'</div>';
}
function plTurnings(p){
  var t=p.turningPoints||[];if(!t.length)return '';
  var h='<div class="tps-h">⚡ 分岐点になった場面</div>';
  t.forEach(function(x){
    var inn=parseInt(x.inning,10)||'';
    var md=x.date.slice(5).replace('-','/');
    var rl=x.result==='W'?'勝':x.result==='L'?'敗':'分';
    h+='<a class="tpi'+(x.intensity==='strong'?' strong':'')+'" href="/?date='+x.date+(inn?'&tp='+inn:'')+'">'
      +'<div class="tpi-top"><span>'+md+'</span><span class="tpi-res '+x.result+'">'+rl+' '+esc(x.score)+'</span><span>'+esc(x.inning)+'</span><span class="tpi-go">試合を見る ›</span></div>'
      +'<div class="tpi-d">'+esc(x.description)+'</div>'+(x.why?'<div class="tpi-w">'+esc(x.why)+'</div>':'')+'</a>';
  });
  return h;
}
function renderPlayers(P){
  var h='<div class="sec"><div class="sec-t">👤 選手個人の振り返り</div>'+heroRanking(P);
  h+='<div class="ldr-tabs"><button class="ldr-tab active" id="pt-batter" onclick="swPl(\'batter\')">打者</button><button class="ldr-tab" id="pt-pitcher" onclick="swPl(\'pitcher\')">投手</button></div>';
  ['batter','pitcher'].forEach(function(t){
    h+='<div id="pl-'+t+'"'+(t==='pitcher'?' style="display:none"':'')+'>';
    P.filter(function(p){return p.type===t;}).forEach(function(p,i){
      var badges=(p.leagueRanks||[]).map(function(r){return '<span class="pl-badge">'+esc(r.item)+' リーグ'+r.rank+'位</span>';}).join('');
      if(p.type==='batter'&&p.stat.pa>=443)badges='<span class="pl-badge">規定打席到達</span>'+badges;
      h+='<div class="pl" id="pl-'+t+'-'+i+'"><div class="pl-h" onclick="this.parentNode.classList.toggle(\'open\')">'
        +'<span class="pl-name">'+esc(p.name)+'</span><span class="pl-tag">'+esc(p.tag||'')+'</span>'+(p.scenes?'<span class="pl-sc"><span class="p">救'+p.scenes.saved+'</span> <span class="m">痛'+p.scenes.hurt+'</span></span>':'')+'<span class="pl-stat">'+esc(plStatShort(p))+'</span><span class="pl-arrow">▶</span></div>'
        +'<div class="pl-b"><div class="pl-line">'+plStatLine(p)+'</div>'+(badges?'<div class="pl-badges">'+badges+'</div>':'')
        +plSpark(p)+'<div class="pl-rev">'+esc(p.review||'')+'</div>'+plScenes(p,t+'-'+i)+(p.next?'<div class="pl-next">↪ 来季へ：'+esc(p.next)+'</div>':'')+'</div></div>';
    });
    h+='</div>';
  });
  h+='<div class="src">成績：NPB公式確定値／月別推移：各試合のボックススコアから集計（参考）／救った・痛かった場面：各試合の記事をAIが仕分けて集計（参考）／振り返り文：AI生成</div></div>';
  return h;
}
function swPl(w){
  ['batter','pitcher'].forEach(function(t){
    document.getElementById('pl-'+t).style.display=t===w?'block':'none';
    document.getElementById('pt-'+t).classList.toggle('active',t===w);
  });
}

function swLdr(w){
  document.getElementById('ldr-bat').style.display=w==='bat'?'block':'none';
  document.getElementById('ldr-pit').style.display=w==='pit'?'block':'none';
  document.getElementById('lt-bat').classList.toggle('active',w==='bat');
  document.getElementById('lt-pit').classList.toggle('active',w==='pit');
}

function renderMonth(month){
  var d=DATA;
  var mm=month.slice(5,7);
  var games=d.allGames.filter(function(g){return g.date.slice(0,7)===month;});
  var w=games.filter(function(g){return g.result==='W';}).length;
  var l=games.filter(function(g){return g.result==='L';}).length;
  var dr=games.filter(function(g){return g.result==='D';}).length;
  var h='';
  h+='<a class="bc" href="/season.html">‹ シーズン総括へ戻る</a>';
  // 月ナビ
  h+='<div class="month-nav">';
  d.monthly.forEach(function(m){
    h+='<span class="month-chip'+(m.month===mm?' active':'')+'" onclick="location.href=\'?month='+d.year+'-'+m.month+'\'">'+parseInt(m.month)+'月</span>';
  });
  h+='</div>';
  h+='<div class="hero" style="padding:1.1rem 1.25rem"><div class="hero-yr">'+d.year+'年 '+parseInt(mm)+'月</div><div class="hero-rec"><span class="big">'+w+'<span style="font-size:20px;color:var(--muted)">勝</span> '+l+'<span style="font-size:20px;color:var(--muted)">敗</span>'+(dr?' '+dr+'<span style="font-size:20px;color:var(--muted)">分</span>':'')+'</span></div></div>';
  // 日別一覧
  h+='<div class="sec" style="padding:.3rem .6rem">';
  if(!games.length)h+='<div class="loading">この月の試合データがありません</div>';
  games.forEach(function(g){
    var md=g.date.slice(5).replace('-','/');
    var sym=g.result==='W'?'○':g.result==='L'?'●':'△';
    h+='<div class="day-row" onclick="location.href=\'/?date='+g.date+'\'">';
    h+='<span class="day-date">'+md+'</span>';
    h+='<span class="day-res '+g.result+'">'+sym+'</span>';
    h+='<span class="day-score">'+g.carpScore+'-'+g.oppScore+'</span>';
    h+='<div class="day-body"><div class="day-opp">vs '+esc(g.opponent)+'</div>'+(g.title?'<div class="day-title">'+esc(g.title)+'</div>':'')+'</div>';
    h+='<span class="day-arrow">›</span></div>';
  });
  h+='</div>';
  document.getElementById('main').innerHTML=h;
}

init();
</script>
</body>
</html>
