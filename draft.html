<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドラフト戦略 - カープトーク</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--surface:#111318;--surface2:#181c23;--surface3:#1e2330;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#eef0f4;--muted:#7a8090;--faint:#2e3340;--accent:#f0c040;--blue:#4a9eff;--green:#3ecf8e;--red:#f46060;--orange:#f07840;--carp:#c8102e;--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
header{border-bottom:1px solid var(--border);padding:0 1.25rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(10,12,15,0.96);backdrop-filter:blur(14px);z-index:100}
.site-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.1em;color:var(--carp);line-height:1}
.site-sub{font-size:10px;color:var(--muted)}
a{color:inherit;text-decoration:none}
.wrap{max-width:680px;margin:0 auto;padding:0 1rem 5rem}
.tabs{display:flex;gap:6px;margin:1rem 0 .2rem}
.tab{flex:1;text-align:center;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:7px;font-size:13px;color:var(--muted)}
.tab.active{background:rgba(200,16,46,.15);border-color:rgba(200,16,46,.45);color:#ff7090;font-weight:700}
.hero{background:radial-gradient(ellipse at top,rgba(200,16,46,.14),transparent 60%),linear-gradient(180deg,var(--surface),#0c0d12);border:1px solid rgba(200,16,46,.3);border-radius:var(--r);padding:1.4rem 1.25rem;margin:1rem 0;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--carp),#ff4060,var(--accent))}
.hero-yr{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.2em;color:var(--accent)}
.hero-title{font-size:21px;font-weight:700;margin:.3rem 0 .6rem}
.hero-ov{font-size:13.5px;line-height:1.8;color:#d5d8de}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem;margin-bottom:1rem}
.sec-t{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--carp);margin-bottom:.3rem}
.sec-d{font-size:11.5px;color:var(--muted);margin-bottom:.9rem;line-height:1.6}
/* needs */
.need{border:1px solid var(--border);background:var(--surface2);border-radius:var(--rs);padding:.75rem .85rem;margin-bottom:8px;position:relative}
.need-p{position:absolute;top:.7rem;right:.8rem;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:var(--faint)}
.need.p1{border-color:rgba(200,16,46,.5);background:rgba(200,16,46,.06)}.need.p1 .need-p{color:var(--carp)}
.need.p2 .need-p,.need.p3 .need-p{color:var(--orange)}
.need-type{font-size:15px;font-weight:700;padding-right:2rem}
.need-meta{display:flex;gap:6px;flex-wrap:wrap;margin:.35rem 0 .45rem}
.chip{font-size:10.5px;border-radius:4px;padding:1px 7px;background:var(--faint);color:var(--muted)}
.chip.pos{background:rgba(74,158,255,.12);color:var(--blue)}
.chip.prof{background:rgba(240,192,64,.12);color:var(--accent)}
.chip.tr{background:rgba(62,207,142,.1);color:var(--green)}
.need-why{font-size:12.5px;line-height:1.7;color:#d5d8de}
.note{font-size:12.5px;line-height:1.7;color:#d5d8de;border-left:3px solid var(--blue);background:rgba(74,158,255,.06);border-radius:0 6px 6px 0;padding:.6rem .8rem;margin-top:.6rem}
.note b{color:var(--blue);font-size:11px;display:block;margin-bottom:2px}
/* position bars */
.pr{border-bottom:1px solid var(--border);padding:.55rem 0}
.pr:last-child{border-bottom:none}
.pr-h{display:flex;align-items:center;gap:8px;cursor:pointer}
.pr-pos{width:48px;font-size:13px;font-weight:700;flex-shrink:0}
.pr-bars{flex:1;position:relative;height:22px}
.pr-bar{position:absolute;left:0;top:3px;height:16px;border-radius:3px;background:var(--carp)}
.pr-avg{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
.pr-v{width:92px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0}
.pr-v small{color:var(--muted);font-size:10.5px}
.rk{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:4px}
.r1{background:rgba(62,207,142,.15);color:var(--green)}.r2,.r3{background:rgba(74,158,255,.12);color:var(--blue)}.r4{background:var(--faint);color:var(--muted)}.r5,.r6{background:rgba(244,96,96,.12);color:var(--red)}
.pr-b{display:none;margin:.5rem 0 .2rem 56px}
.pr.open .pr-b{display:block}
.tm{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:2px 0;font-variant-numeric:tabular-nums}
.tm-n{width:58px;color:var(--muted)}
.tm-bar{height:8px;border-radius:2px;background:var(--surface3)}
.tm.me .tm-n{color:#ff7090;font-weight:700}.tm.me .tm-bar{background:var(--carp)}
.tm-v{width:38px;text-align:right}
.tm-r{color:var(--faint);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.regs{font-size:11.5px;color:var(--muted);margin-top:.4rem;line-height:1.7}
.age{border-radius:3px;padding:0 4px;font-size:10.5px}
.age.old{background:rgba(244,96,96,.15);color:var(--red)}.age.young{background:rgba(62,207,142,.12);color:var(--green)}.age.mid{background:var(--faint);color:var(--muted)}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--muted);margin-bottom:.4rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
/* lineup */
.lu{display:flex;align-items:flex-end;gap:5px;height:130px;margin:.4rem 0 .3rem;position:relative}
.lu-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.lu-c b{font-weight:400;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.lu-c span{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--surface3)}
.lu-c.weak span{background:var(--red)}.lu-c.strong span{background:var(--green)}
.lu-c em{font-style:normal;font-size:11px;margin-top:3px}
.lu-line{position:absolute;left:0;right:0;border-top:1px dashed var(--accent);opacity:.7}
.lu-line small{position:absolute;right:0;top:-15px;font-size:9.5px;color:var(--accent)}
.lu-who{font-size:11px;color:var(--muted);line-height:1.8;margin-top:.5rem}
.lu-who b{color:var(--text);font-weight:500}
/* pitching */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:.6rem}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:.6rem .7rem}
.kpi-h{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:.3rem}
.kpi-row{display:flex;justify-content:space-between;font-size:12px;padding:1px 0;font-variant-numeric:tabular-nums}
.kpi-row span:first-child{color:var(--muted)}
.lgrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.lgrow:last-child{border-bottom:none}
.lgrow small{color:var(--muted);font-size:10.5px}
.stl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;margin-top:.5rem}
.stl td,.stl th{padding:4px 3px;border-bottom:1px solid var(--border);text-align:right}
.stl th{font-size:10.5px;color:var(--muted);font-weight:500}
.stl td:first-child,.stl th:first-child{text-align:left}
/* age distribution */
.ad{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.ad-n{width:52px;color:var(--muted);flex-shrink:0}
.ad-bar{flex:1;display:flex;height:16px;border-radius:3px;overflow:hidden}
.ad-bar div{display:flex;align-items:center;justify-content:center;font-size:9.5px;color:rgba(0,0,0,.75);font-weight:700}
.a1{background:#3ecf8e}.a2{background:#7fd4b0}.a3{background:#e8b04a}.a4{background:#f46060}
.src{font-size:10px;color:var(--faint);margin-top:.6rem;line-height:1.6}
.fl{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.7rem}
.fl button{background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:3px 11px;font-size:11.5px;color:var(--muted);cursor:pointer;font-family:inherit}
.fl button.on{background:rgba(200,16,46,.15);border-color:rgba(200,16,46,.45);color:#ff7090}
.cd{border:1px solid var(--border);background:var(--surface2);border-radius:var(--rs);padding:.65rem .75rem;margin-bottom:7px}
.cd-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cd-n{font-size:14.5px;font-weight:700}
.cd-t{font-size:11.5px;color:var(--muted)}
.tier{font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px}
.tier.t1{background:rgba(200,16,46,.2);color:#ff7090}.tier.t2{background:rgba(240,120,64,.15);color:var(--orange)}.tier.t3{background:var(--faint);color:var(--muted)}
.cd-p{font-size:11.5px;color:#cfd2d8;margin:.25rem 0 .35rem}
.cd-f{display:flex;gap:4px;flex-wrap:wrap}
.cd-f span{font-size:10.5px;background:var(--surface3);color:#cfd2d8;border-radius:4px;padding:1px 6px}
.cd-m{display:flex;gap:4px;flex-wrap:wrap;margin-top:.4rem}
.cd-m span{font-size:10.5px;background:rgba(62,207,142,.12);color:var(--green);border-radius:4px;padding:1px 6px}
.cd-c{font-size:11px;color:var(--accent);margin-top:.35rem}
.cd-s{font-size:10px;color:var(--faint);margin-top:.3rem}
.cd-s a{color:var(--blue);margin-right:6px}
.crp{font-size:12px;line-height:1.65;color:#d5d8de;padding:.35rem 0;border-bottom:1px solid var(--border)}
.crp:last-child{border-bottom:none}
.crp a{color:var(--blue);font-size:10.5px;margin-left:4px}
.need-cands{font-size:11px;color:var(--muted);margin-top:.4rem}
.need-cands b{color:var(--green);font-weight:500}
.rs-hero{background:radial-gradient(ellipse at top,rgba(240,192,64,.12),transparent 60%),linear-gradient(180deg,var(--surface),#0c0d12);border:1px solid rgba(240,192,64,.35);border-radius:var(--r);padding:1.3rem 1.2rem;margin:1rem 0;position:relative;overflow:hidden}
.rs-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#ff4060,var(--carp))}
.rs-sum{display:flex;gap:6px;flex-wrap:wrap;margin:.5rem 0 .7rem}
.rs-sum span{font-size:11.5px;background:var(--surface2);border:1px solid var(--border2);border-radius:5px;padding:2px 8px;color:#d5d8de}
.r1box{border-left:3px solid var(--accent);background:rgba(240,192,64,.06);border-radius:0 6px 6px 0;padding:.55rem .75rem;font-size:12.5px;line-height:1.7;color:#d5d8de;margin-top:.4rem}
.pk{border:1px solid var(--border);background:var(--surface2);border-radius:var(--rs);margin-bottom:8px;overflow:hidden}
.pk.top{border-color:rgba(240,192,64,.45)}
.pk-h{display:flex;align-items:center;gap:8px;padding:.65rem .75rem;cursor:pointer}
.pk-r{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.04em;border-radius:4px;padding:1px 7px;background:var(--carp);color:#fff;white-space:nowrap}
.pk-r.dev{background:var(--surface3);color:var(--muted)}
.pk-n{font-size:15px;font-weight:700;white-space:nowrap}
.pk-t{font-size:11.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-a{color:var(--faint);font-size:11px;transition:transform .2s}
.pk.open .pk-a{transform:rotate(90deg)}
.pk-b{display:none;padding:0 .8rem .8rem;border-top:1px solid var(--border)}
.pk.open .pk-b{display:block}
.pk-p{font-size:11.5px;color:#cfd2d8;margin:.55rem 0 .4rem}
.pk-l{font-size:10.5px;font-weight:700;margin:.6rem 0 .2rem;letter-spacing:.04em}
.pk-l.e{color:var(--blue)}.pk-l.i{color:var(--accent)}
.pk-x{font-size:12.5px;line-height:1.7;color:#d5d8de}
.pk-x.none{color:var(--faint);font-size:11.5px}
.divider{display:flex;align-items:center;gap:10px;margin:1.6rem 0 .2rem;font-size:11.5px;color:var(--muted)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border2)}
.cd-dr{font-size:10.5px;font-weight:700;background:var(--carp);color:#fff;border-radius:4px;padding:1px 6px}
.loading{text-align:center;padding:4rem 0;color:var(--muted)}
.score-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.score-row .n{width:72px}.score-row .b{flex:1;height:8px;border-radius:3px;background:var(--faint);overflow:hidden}.score-row .b i{display:block;height:100%;background:var(--orange)}
.score-row .v{width:34px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <div><div class="site-title">本日のカープトーク</div><div class="site-sub">2026シーズン総括</div></div>
</header>
<div class="wrap">
  <div class="tabs"><a class="tab" href="/season.html">📘 シーズン総括</a><a class="tab active" href="/draft.html">🎯 ドラフト戦略</a></div>
  <div id="main"><div class="loading">読み込み中...</div></div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function n(v){var x=parseFloat(v);return isNaN(x)?0:x;}
function ageCls(a){return a==null?'mid':a>=33?'old':a<=25?'young':'mid';}
function ageTag(a){return a==null?'':'<span class="age '+ageCls(a)+'">'+a+'歳</span>';}

var CANDS=null,NEEDS=[],CF='all',RES=null;
function pickOf(name){if(!RES)return null;return RES.picks.find(function(p){return p.name.replace(/^𠮷/,'吉')===name.replace(/^𠮷/,'吉');})||null;}
function renderResults(R){
  var sh=R.picks.filter(function(p){return p.type==='支配下';}),dv=R.picks.filter(function(p){return p.type==='育成';});
  var cat={};R.picks.forEach(function(p){cat[p.category]=(cat[p.category]||0)+1;});
  var h='<div class="rs-hero"><div class="hero-yr" style="color:var(--accent)">2026 DRAFT RESULT · '+esc(R.draftDate)+'</div><div class="hero-title">カープの指名選手と、その狙い</div>';
  h+='<div class="rs-sum"><span>支配下 '+sh.length+'人</span><span>育成 '+dv.length+'人</span>'+Object.keys(cat).map(function(k){return '<span>'+esc(k)+' '+cat[k]+'</span>';}).join('')+'</div>';
  if(R.round1)h+='<div class="r1box"><b style="color:var(--accent)">1位指名</b>　'+esc(R.round1.result)+'<br><span style="color:var(--muted);font-size:11.5px">'+esc(R.round1.lottery)+'</span></div>';
  h+='</div>';
  h+='<div class="sec"><div class="sec-t">📝 指名選手（タップで特徴と狙い）</div><div class="sec-d">特徴・評価は各報道の要約。「球団の狙い」は監督・スカウト部長・担当スカウトの発言として報じられた内容の要約です。緑のバッジは、ドラフト前に整理した「必要な選手タイプ」の枠との対応。</div>';
  R.picks.forEach(function(p,i){
    var ns=NEEDS.filter(function(n){return matchNeed(n,p);});
    var hand=(p.throws?p.throws+'投':'')+(p.bats?p.bats+'打':'');
    var body=[esc(p.posDetail||p.pos),hand,p.height?esc(p.height)+(p.weight?'・'+esc(p.weight):''):'',p.age?esc(p.age)+'歳':'',p.highSchool?esc(p.highSchool)+'出身':''].filter(Boolean).join('｜');
    h+='<div class="pk'+(i===0?' top open':'')+'" id="pk'+i+'"><div class="pk-h" onclick="document.getElementById(\'pk'+i+'\').classList.toggle(\'open\')">'
      +'<span class="pk-r'+(p.type==='育成'?' dev':'')+'">'+(p.type==='育成'?'':'')+esc(p.round)+'</span><span class="pk-n">'+esc(p.name)+'</span><span class="pk-t">'+esc(p.team)+'・'+esc(p.pos)+'</span><span class="pk-a">▶</span></div>'
      +'<div class="pk-b"><div class="pk-p">'+body+'</div>'
      +(p.hiroshimaConnection?'<div class="cd-c">🎏 '+esc(p.hiroshimaConnection)+'</div>':'')
      +'<div class="cd-f" style="margin-top:.4rem">'+(p.features||[]).map(function(f){return '<span>'+esc(f)+'</span>';}).join('')+'</div>'
      +(ns.length?'<div class="cd-m">'+ns.map(function(n){return '<span>必要タイプ'+n.priority+'の枠（'+esc(n.pos)+'・'+esc(String(n.profile).replace(/（.*）/,''))+'）</span>';}).join('')+'</div>':'')
      +'<div class="pk-l e">評価</div><div class="pk-x'+(p.evaluation?'':' none')+'">'+(p.evaluation?esc(p.evaluation):'詳しい評価の報道は見つかっていません')+'</div>'
      +'<div class="pk-l i">球団の狙い</div><div class="pk-x'+(p.teamIntent?'':' none')+'">'+(p.teamIntent?esc(p.teamIntent):'この選手についての球団の個別コメントは見つかっていません')+'</div>'
      +(p.verificationNote?'<div class="pk-x none" style="margin-top:.3rem">※'+esc(p.verificationNote)+'</div>':'')
      +'<div class="cd-s">出典 '+(p.sources||[]).slice(0,4).map(function(u,k){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+(k+1)+'</a>';}).join('')+'</div></div></div>';
  });
  h+='</div>';
  if((R.overall||[]).length||(R.media||[]).length){
    h+='<div class="sec"><div class="sec-t">🎯 ドラフト全体の狙い</div>';
    (R.overall||[]).forEach(function(o){h+='<div class="crp">'+esc(o.point)+'<a href="'+esc(o.source)+'" target="_blank" rel="noopener">出典</a></div>';});
    if((R.media||[]).length){h+='<div class="pk-l e" style="margin-top:.8rem">メディアの評価</div>';(R.media||[]).forEach(function(o){h+='<div class="crp">'+esc(o.point)+'<a href="'+esc(o.source)+'" target="_blank" rel="noopener">出典</a></div>';});}
    h+='<div class="src">'+esc(R.note||'')+'。情報は'+esc(R.asOf)+'時点の報道に基づきます。</div></div>';
  }
  return h;
}
// 候補が「必要な選手タイプ」に当てはまるか（守備位置・高校生/即戦力・投手の左右で判定）
function matchNeed(need,p){
  var pos=need.pos||'',prof=need.profile||'',txt=(need.type||'')+(need.traits||[]).join('');
  var det=(p.posDetail||'');
  var ok=false;
  if(/捕手/.test(pos))ok=p.pos==='捕手';
  else if(/二塁|遊撃/.test(pos))ok=p.pos==='内野手'&&(/二塁|遊撃/.test(det)||!det);
  else if(/三塁|一塁/.test(pos))ok=p.pos==='内野手'&&(/三塁|一塁/.test(det)||!det);
  else if(/外野/.test(pos))ok=p.pos==='外野手';
  else if(/先発|投手|救援/.test(pos)){ok=p.pos==='投手';if(ok&&/右腕/.test(txt))ok=p.throws==='右';if(ok&&/左腕/.test(txt)&&!/右腕/.test(txt))ok=p.throws==='左';if(ok&&/先発/.test(pos)&&/リリーフ|救援|抑え/.test(det))ok=false;if(ok&&/救援/.test(pos)&&/先発/.test(det))ok=false;}
  if(!ok)return false;
  if(/高校生/.test(prof))return p.category==='高校';
  if(/即戦力/.test(prof))return p.category==='大学'||p.category==='社会人'||p.category==='独立';
  return true;
}
function needsOf(p){return NEEDS.filter(function(n){return matchNeed(n,p);});}
function needCands(n){
  if(!CANDS)return '';
  var m=CANDS.players.filter(function(p){return matchNeed(n,p);});
  if(!m.length)return '<div class="need-cands">この枠（守備位置・区分）に合う有力候補：一覧には見当たらず</div>';
  return '<div class="need-cands">この枠（守備位置・区分）に合う有力候補：<b>'+m.map(function(p){return esc(p.name)+'（'+esc(p.team)+'）';}).join('、')+'</b></div>';
}
var TIER={'1位候補':'t1','上位候補':'t2','注目':'t3'};
function candCard(p){
  var ns=needsOf(p);
  var hand=(p.throws?p.throws+'投':'')+(p.bats?p.bats+'打':'');
  var dr=pickOf(p.name);
  return '<div class="cd"'+(dr?' style="border-color:rgba(200,16,46,.5)"':'')+'><div class="cd-h"><span class="tier '+(TIER[p.tier]||'t3')+'">'+esc(p.tier)+'</span><span class="cd-n">'+esc(p.name)+'</span>'+(dr?'<span class="cd-dr">広島 '+esc(dr.type==='育成'?'育成'+dr.round.replace('育成',''):dr.round)+'指名</span>':'')+'<span class="cd-t">'+esc(p.team)+'・'+esc(p.category)+(p.grade?' '+esc(p.grade):'')+'</span></div>'
    +'<div class="cd-p">'+esc(p.posDetail||p.pos)+(hand?'｜'+hand:'')+'</div>'
    +'<div class="cd-f">'+(p.features||[]).map(function(f){return '<span>'+esc(f)+'</span>';}).join('')+'</div>'
    +(ns.length?'<div class="cd-m">'+ns.map(function(n){return '<span>必要タイプ'+n.priority+'の枠に合致（'+esc(n.pos)+'・'+esc(String(n.profile).replace(/（.*）/,''))+'）</span>';}).join('')+'</div>':'')
    +(p.carpLink?'<div class="cd-c">🎏 '+esc(p.carpLink)+'</div>':'')
    +'<div class="cd-s">出典 '+(p.sources||[]).slice(0,3).map(function(u,i){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+(i+1)+'</a>';}).join('')+'</div></div>';
}
function renderCandList(){
  var L=CANDS.players.filter(function(p){
    if(CF==='all')return true;if(CF==='fit')return needsOf(p).length>0;if(CF==='carp')return !!p.carpLink;
    return p.pos===CF;
  });
  var order={'1位候補':0,'上位候補':1,'注目':2};
  L.sort(function(a,b){return (order[a.tier]-order[b.tier])||(needsOf(b).length-needsOf(a).length);});
  document.getElementById('cand-list').innerHTML=L.map(candCard).join('')||'<div class="sec-d">該当なし</div>';
  document.querySelectorAll('.fl button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-f')===CF);});
}
function setCF(f){CF=f;renderCandList();}
function renderCands(){
  if(!CANDS)return '';
  var C=CANDS,h='<div class="sec"><div class="sec-t">📋 有力ドラフト候補（2026年）</div>';
  h+='<div class="sec-d">ドラフト会議：'+esc(String(C.draftDate).split('。')[0])+'。複数の報道・NPBのプロ志望届情報で上位候補とされる選手（'+esc(C.asOf)+'時点）。緑のバッジは、上の「必要な選手タイプ」と守備位置・区分（高校生／即戦力）・投手の左右が合う候補（能力の特徴までは判定していません）。</div>';
  if(C.carpReports&&C.carpReports.length){
    h+='<div class="mgrp-h" style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:.3rem">🎏 カープの動きに関する報道</div>';
    C.carpReports.forEach(function(r){h+='<div class="crp">'+esc(r.summary)+'<a href="'+esc(r.source)+'" target="_blank" rel="noopener">出典</a></div>';});
    h+='<div style="height:.8rem"></div>';
  }
  var cnt=function(f){return C.players.filter(function(p){return f(p);}).length;};
  var F=[['all','すべて',cnt(function(){return true;})],['fit','必要タイプの枠に合致',cnt(function(p){return needsOf(p).length>0;})],['carp','カープ関連',cnt(function(p){return !!p.carpLink;})],['投手','投手',cnt(function(p){return p.pos==='投手';})],['捕手','捕手',cnt(function(p){return p.pos==='捕手';})],['内野手','内野手',cnt(function(p){return p.pos==='内野手';})],['外野手','外野手',cnt(function(p){return p.pos==='外野手';})]];
  h+='<div class="fl">'+F.map(function(f){return '<button data-f="'+f[0]+'" onclick="setCF(\''+f[0]+'\')">'+f[1]+' '+f[2]+'</button>';}).join('')+'</div><div id="cand-list"></div>';
  if(C.excluded&&C.excluded.length){
    h+='<details style="margin-top:.6rem"><summary style="font-size:11.5px;color:var(--muted);cursor:pointer">一覧から外した選手（'+C.excluded.length+'人）</summary>';
    C.excluded.forEach(function(e){h+='<div class="crp">'+esc(e.name)+'：'+esc(e.reason)+(e.source?'<a href="'+esc(e.source)+'" target="_blank" rel="noopener">出典</a>':'')+'</div>';});
    h+='</details>';
  }
  h+='<div class="src">候補の特徴は各報道の記載に基づく要約です。評価や順位は媒体により異なります。「カープ関連」には球団の正式発表ではない報道・予想も含みます。</div></div>';
  return h;
}

async function init(){
  var d;
  try{d=await (await fetch('/games/draft_analysis_2026.json?t='+Date.now())).json();}
  catch(e){document.getElementById('main').innerHTML='<div class="loading">データを読み込めませんでした</div>';return;}
  try{CANDS=await (await fetch('/games/draft_candidates_2026.json?t='+Date.now())).json();}catch(e){CANDS=null;}
  try{RES=await (await fetch('/games/draft_results_2026.json?t='+Date.now())).json();}catch(e){RES=null;}
  var h='';
  var S=d.strategy;
  NEEDS=(d.strategy&&d.strategy.needs)||[];
  if(RES){h+=renderResults(RES);h+='<div class="divider">ここから下はドラフト前（10/17時点）の分析</div>';}
  h+='<div class="hero"><div class="hero-yr">CARP 2026 DRAFT STRATEGY</div><div class="hero-title">今オフ、カープに必要な選手像</div>';
  h+='<div class="hero-ov">'+(S&&S.summary?esc(S.summary):'今季のデータ（守備位置別の打力・打順別の打力・投手陣の指標・年齢構成）から、補強が必要なポジションと選手タイプを整理します。')+'</div></div>';

  h+=renderNeeds(d);
  h+=renderCands();
  h+=renderPositions(d);
  h+=renderLineup(d);
  h+=renderPitching(d);
  h+=renderAges(d);
  h+=renderFarm(d);
  h+='<div class="src">出典：'+d.sources.map(esc).join('／')+'。年齢は2027年4月1日時点。「必要な選手タイプ」はAIがこれらの数値をもとに作成したもので、球団の方針ではありません。</div>';
  document.getElementById('main').innerHTML=h;
  if(CANDS)renderCandList();
}

function renderNeeds(d){
  var S=d.strategy;
  var h='<div class="sec"><div class="sec-t">🎯 必要な選手タイプ（優先順）</div>';
  if(S&&S.needs&&S.needs.length){
    h+='<div class="sec-d">下のデータを根拠に、補強の優先度が高い順に並べています。</div>';
    S.needs.forEach(function(x){
      h+='<div class="need p'+x.priority+'"><span class="need-p">'+x.priority+'</span><div class="need-type">'+esc(x.type)+'</div>'
        +'<div class="need-meta"><span class="chip pos">'+esc(x.pos)+'</span><span class="chip prof">'+esc(x.profile)+'</span>'+(x.traits||[]).map(function(t){return '<span class="chip tr">'+esc(t)+'</span>';}).join('')+'</div>'
        +'<div class="need-why">'+esc(x.why)+'</div>'+needCands(x)+'</div>';
    });
    if(S.lineupIdeal)h+='<div class="note"><b>打順の観点</b>'+esc(S.lineupIdeal)+'</div>';
    if(S.caution)h+='<div class="note" style="border-left-color:var(--accent);background:rgba(240,192,64,.06)"><b style="color:var(--accent)">注意点</b>'+esc(S.caution)+'</div>';
  }
  // 数値ベースの優先度
  var max=Math.max.apply(null,d.needScores.map(function(x){return x.score;}))||1;
  h+='<div class="sec-d" style="margin:.9rem 0 .3rem">数値ベースの補強優先度（打力の差・リーグ順位・主力の年齢・投手指標から算出）</div>';
  d.needScores.forEach(function(x){h+='<div class="score-row"><span class="n">'+esc(x.pos)+'</span><span class="b"><i style="width:'+(x.score/max*100)+'%"></i></span><span class="v">'+x.score+'</span></div>';});
  return h+'</div>';
}

function renderPositions(d){
  var all=[];d.positions.forEach(function(p){p.teams.forEach(function(t){all.push(n(t.ops));});});
  var mx=Math.max.apply(null,all)*1.05;
  var h='<div class="sec"><div class="sec-t">🧢 守備位置別の打力（セ・リーグ比較）</div>';
  h+='<div class="sec-d">各ポジションを守った選手のOPSを出場試合数で加重したもの。黄線は他5球団の平均。タップで6球団比較。</div>';
  h+='<div class="legend"><span><i style="background:var(--carp)"></i>カープ</span><span><i style="background:var(--accent)"></i>他5球団平均</span></div>';
  d.positions.forEach(function(p,i){
    var age=(d.ages.fielders.find(function(f){return f.pos===p.pos;})||{}).players||[];
    h+='<div class="pr" id="pr'+i+'"><div class="pr-h" onclick="document.getElementById(\'pr'+i+'\').classList.toggle(\'open\')">'
      +'<span class="pr-pos">'+esc(p.pos.replace('手',''))+'</span><div class="pr-bars"><div class="pr-bar" style="width:'+(n(p.carpOps)/mx*100)+'%"></div><div class="pr-avg" style="left:'+(n(p.leagueAvgOps)/mx*100)+'%"></div></div>'
      +'<span class="pr-v">'+esc(p.carpOps)+' <small>/'+esc(p.leagueAvgOps)+'</small><span class="rk r'+p.rank+'">'+p.rank+'位</span></span></div><div class="pr-b">';
    p.teams.forEach(function(t){
      h+='<div class="tm'+(t.team==='広島'?' me':'')+'"><span class="tm-n">'+esc(t.team)+'</span><span class="tm-bar" style="width:'+(n(t.ops)/mx*45)+'%"></span><span class="tm-v">'+esc(t.ops)+'</span><span class="tm-r">'+esc(t.regular)+'</span></div>';
    });
    h+='<div class="regs">カープの主な出場：'+age.map(function(r){return esc(r.name)+' '+ageTag(r.age)+' <span style="color:var(--faint)">'+r.g+'試合 OPS'+esc(r.ops)+'</span>';}).join('、')+'</div></div></div>';
  });
  h+='<div class="src">※外野は左中右の区別なし。複数ポジションを守った選手は、その選手のシーズン全体のOPSで計算。</div>';
  return h+'</div>';
}

function renderLineup(d){
  var L=d.lineup.filter(function(x){return x.slot<=8;}); // 9番は投手打席が中心のため除外
  var vals=L.map(function(x){return n(x.ops);});
  var team=L.reduce(function(s,x){return s+n(x.ops)*x.pa;},0)/L.reduce(function(s,x){return s+x.pa;},0);
  var mx=Math.max.apply(null,vals)*1.1;
  var h='<div class="sec"><div class="sec-t">🔢 打順別の打力（OPS）</div><div class="sec-d">1〜8番（9番は投手の打席が中心のため除外）。点線は1〜8番の平均、赤は平均を大きく下回る打順。</div><div class="lu">';
  h+='<div class="lu-line" style="bottom:'+Math.round(team/mx*96+18)+'px"><small>平均 '+team.toFixed(3).replace(/^0/,'')+'</small></div>';
  L.forEach(function(x){
    var v=n(x.ops),cls=v<team-0.03?'weak':v>team+0.05?'strong':'';
    h+='<div class="lu-c '+cls+'"><b>'+esc(x.ops)+'</b><span style="height:'+Math.round(v/mx*96)+'px"></span><em>'+x.slot+'番</em></div>';
  });
  h+='</div><div class="lu-who">';
  L.forEach(function(x){h+='<div><b>'+x.slot+'番</b> 出塁率'+esc(x.obp)+' 長打率'+esc(x.slg)+'｜主に '+x.top.map(function(t){return esc(t.name);}).join('・')+'</div>';});
  return h+'</div></div>';
}

function renderPitching(d){
  var P=d.pitching,st=P.starter,rp=P.reliever,lg=P.league;
  var h='<div class="sec"><div class="sec-t">⚾ 投手陣</div><div class="sec-d">先発・救援は各試合の継投から集計。リーグ比較はNPB公式のチーム投手成績。</div><div class="kpis">';
  h+='<div class="kpi"><div class="kpi-h">先発（'+st.gs+'試合）</div>'
    +kr('防御率',st.era)+kr('QS率',(n(st.qsRate)*100).toFixed(1)+'%')+kr('1登板平均',st.ipPerStart+'回')+kr('5回未満で降板',st.shortStarts+'回')+kr('奪三振率(K/9)',st.k9)+kr('与四球率(BB/9)',st.bb9)+'</div>';
  h+='<div class="kpi"><div class="kpi-h">救援（'+rp.appearances+'登板）</div>'
    +kr('防御率',rp.era)+kr('投球回',rp.ip)+kr('奪三振率(K/9)',rp.k9)+kr('与四球率(BB/9)',rp.bb9)+kr('被本塁打率',rp.hr9)+kr('WHIP',rp.whip)+'</div>';
  h+='</div>';
  var R=P.starterByHand['右']||{},Lh=P.starterByHand['左']||{};
  h+='<div class="kpis"><div class="kpi"><div class="kpi-h">右腕の先発</div>'+kr('先発数',R.gs)+kr('防御率',R.era)+kr('投球回',R.ip)+'</div><div class="kpi"><div class="kpi-h">左腕の先発</div>'+kr('先発数',Lh.gs)+kr('防御率',Lh.era)+kr('投球回',Lh.ip)+'</div></div>';
  h+='<div class="sec-d" style="margin:.5rem 0 .2rem">チーム全体のリーグ比較（6球団中）</div>';
  [['防御率','teamERA'],['奪三振率（9回あたり）','teamK9'],['与四球率（9回あたり）','teamBB9'],['被本塁打率（9回あたり）','teamHR9']].forEach(function(x){
    var v=lg[x[1]];h+='<div class="lgrow"><span>'+x[0]+'</span><span>'+v.carp+' <small>平均'+v.avg+'</small><span class="rk r'+v.rank+'">'+v.rank+'位</span></span></div>';
  });
  h+='<table class="stl"><tr><th>主な先発</th><th>左右</th><th>先発</th><th>投球回</th><th>防御率</th><th>QS</th><th>来季年齢</th></tr>';
  P.starters.forEach(function(s){
    var a=(d.ages.pitchers.find(function(p){return p.name.indexOf(s.name)===0;})||{}).age;
    h+='<tr><td>'+esc(s.name)+'</td><td>'+esc(s.hand||'')+'</td><td>'+s.gs+'</td><td>'+esc(s.ip)+'</td><td>'+esc(s.era)+'</td><td>'+s.qs+'</td><td>'+ageTag(a)+'</td></tr>';
  });
  return h+'</table></div>';
}
function kr(k,v){return '<div class="kpi-row"><span>'+k+'</span><span>'+esc(v)+'</span></div>';}

function renderAges(d){
  var A=d.ages;
  var h='<div class="sec"><div class="sec-t">📅 年齢構成（2027年4月1日時点）</div><div class="sec-d">支配下選手の年齢分布。赤は33歳以上の主力、緑は25歳以下。</div>';
  var lab={'〜23':'a1','24〜27':'a2','28〜31':'a3','32〜':'a4'};
  h+='<div class="legend">'+Object.keys(lab).map(function(k){return '<span><i class="'+lab[k]+'"></i>'+k+'歳</span>';}).join('')+'</div>';
  ['投手','捕手','内野手','外野手'].forEach(function(c){
    var b=A.distribution[c];if(!b)return;var tot=Object.values(b).reduce(function(s,x){return s+x;},0)||1;
    h+='<div class="ad"><span class="ad-n">'+c+' '+tot+'</span><div class="ad-bar">'+Object.keys(lab).map(function(k){return b[k]?'<div class="'+lab[k]+'" style="width:'+(b[k]/tot*100)+'%">'+b[k]+'</div>':'';}).join('')+'</div></div>';
  });
  h+='<div class="sec-d" style="margin:.9rem 0 .3rem">主力の年齢（守備位置別・出場上位）</div>';
  A.fielders.forEach(function(f){h+='<div class="regs"><b style="color:var(--text)">'+esc(f.pos)+'</b>　'+f.players.map(function(p){return esc(p.name)+' '+ageTag(p.age);}).join('、')+'</div>';});
  h+='<div class="regs" style="margin-top:.4rem"><b style="color:var(--text)">投手</b>　'+A.pitchers.map(function(p){return esc(p.name)+'<span style="color:var(--faint)">('+p.role+')</span> '+ageTag(p.age);}).join('、')+'</div>';
  return h+'</div>';
}

function renderFarm(d){
  if(!d.farm)return '';
  var F=d.farm,h='<div class="sec"><div class="sec-t">🌱 2軍の主な選手（参考）</div><div class="sec-d">ウエスタン・リーグで規定到達した選手のみ（'+esc(String(F.fetchedAt).slice(0,10))+'時点）。</div>';
  h+='<table class="stl"><tr><th>打者</th><th>試合</th><th>打率</th><th>本塁打</th><th>盗塁</th><th>OPS</th></tr>';
  F.batters.forEach(function(b){h+='<tr><td>'+esc(b.name)+'</td><td>'+b.games+'</td><td>'+esc(b.avg)+'</td><td>'+b.hr+'</td><td>'+b.sb+'</td><td>'+esc(b.ops)+'</td></tr>';});
  h+='</table>';
  if(F.pitchers&&F.pitchers.length){
    h+='<table class="stl"><tr><th>投手</th><th>登板</th><th>防御率</th><th>投球回</th></tr>';
    F.pitchers.forEach(function(p){h+='<tr><td>'+esc(p.name)+'</td><td>'+(p.games||p.g||'')+'</td><td>'+esc(p.era)+'</td><td>'+esc(p.ip||'')+'</td></tr>';});
    h+='</table>';
  }
  return h+'</div>';
}
init();
</script>
</body>
</html>
